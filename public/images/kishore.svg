<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12121e" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a2e" />
      <stop offset="100%" stop-color="#8b0000" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e01020" />
      <stop offset="100%" stop-color="#ff4757" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="100" fill="url(#bgGrad)" />
  <circle cx="100" cy="100" r="98" stroke="url(#redGlow)" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Subtle tech grid -->
  <path d="M40 100h120M100 40v120" stroke="rgba(224,16,32,0.15)" stroke-width="1" />
  
  <!-- Stylized Monogram KM & Developer Icon -->
  <g transform="translate(100, 92)" text-anchor="middle">
    <circle cx="0" cy="-22" r="26" fill="#1c1c28" stroke="url(#accentGrad)" stroke-width="2.5" />
    <!-- Head silhouette -->
    <path d="M-12 -25 A12 12 0 0 1 12 -25 A12 14 0 0 1 -12 -25" fill="#f0f0f5" opacity="0.9" />
    <path d="M-18 -12 C-18 -4, -8 2, 0 2 C8 2, 18 -4, 18 -12" fill="url(#accentGrad)" opacity="0.85" />
    
    <!-- Shoulders / Torso -->
    <path d="M-42 42 C-40 18, -25 8, 0 8 C25 8, 40 18, 42 42 Z" fill="#181824" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    <path d="M-22 42 C-20 22, -12 14, 0 14 C12 14, 20 22, 22 42 Z" fill="url(#redGlow)" opacity="0.7" />
    
    <!-- Code brackets tag symbol on chest -->
    <path d="M-7 27 L-12 32 L-7 37 M7 27 L12 32 L7 37" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Outer glowing node dots -->
  <circle cx="100" cy="8" r="3.5" fill="#e01020" />
  <circle cx="192" cy="100" r="3.5" fill="#e01020" />
  <circle cx="100" cy="192" r="3.5" fill="#e01020" />
  <circle cx="8" cy="100" r="3.5" fill="#e01020" />
</svg>
